name: Build packages

on:
  push:
    paths:
      - '*/PKGBUILD'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package directory to build (leave empty for all)'
        required: false
        type: string

permissions:
  contents: write

env:
  REPO_NAME: personal-repo

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.changed.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Find changed packages
        id: changed
        run: |
          if [ -n "${{ github.event.inputs.package }}" ]; then
            matrix=$(printf '%s\n' "${{ github.event.inputs.package }}" \
              | jq -R -s -c 'split("\n") | map(select(. != ""))')
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            matrix=$(find . -maxdepth 2 -name PKGBUILD -exec dirname {} \; \
              | sed 's|^\./||' | grep -v '^_template$' | sort -u \
              | jq -R -s -c 'split("\n") | map(select(. != ""))')
          else
            matrix=$(git diff --name-only HEAD~1 HEAD \
              | grep '/PKGBUILD$' | sed 's|/PKGBUILD$||' | sed 's|^\./||' \
              | grep -v '^_template$' | sort -u \
              | jq -R -s -c 'split("\n") | map(select(. != ""))')
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: needs.detect.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    container: cachyos/docker-makepkg-v3
    strategy:
      matrix:
        package: ${{ fromJson(needs.detect.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - name: Fix permissions for builder user
        run: chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Build
        run: |
          su builder -c 'cd "${{ matrix.package }}" && makepkg -cfs --noconfirm'
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}
          path: ${{ matrix.package }}/*.pkg.tar.zst
          retention-days: 1

  publish:
    needs: [detect, build]
    if: needs.detect.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    container: cachyos/docker-makepkg-v3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: repo-staging
          merge-multiple: true
      - name: Remove stale release assets
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pacman -S --noconfirm github-cli || true
          tag="repository"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || exit 0
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' \
            | while read -r asset; do
                [ -n "$asset" ] && gh release delete-asset "$tag" "$asset" --repo "$GITHUB_REPOSITORY" -y || true
              done
      - name: Build repo database
        run: |
          cd repo-staging
          repo-add "${REPO_NAME}.db.tar.zst" *.pkg.tar.zst
      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="repository"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" --title "Package Repository" --notes "" --repo "$GITHUB_REPOSITORY"
          gh release upload "$tag" repo-staging/* --clobber --repo "$GITHUB_REPOSITORY"
