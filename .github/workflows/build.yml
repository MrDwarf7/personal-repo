name: Build packages

on:
  push:
    paths:
      - '*/PKGBUILD'
  workflow_run:
    workflows:
      - 'Update packages'
    types:
      - completed
  workflow_dispatch:
    inputs:
      package:
        description: 'Package directory to build (leave empty for all)'
        required: false
        type: string

permissions:
  contents: write

env:
  REPO_NAME: personal-repo

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.changed.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Find changed packages
        id: changed
        run: |
          if [ -n "${{ github.event.inputs.package }}" ]; then
            matrix=$(printf '%s\n' "${{ github.event.inputs.package }}" \
              | jq -R -s -c 'split("\n") | map(select(. != ""))')
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            matrix=$(find . -maxdepth 2 -name PKGBUILD -exec dirname {} \; \
              | sed 's|^\./||' | grep -v '^_template$' | sort -u \
              | jq -R -s -c 'split("\n") | map(select(. != ""))')
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            # Triggered by the Update packages cron after it committed+pushed a
            # version bump. Update packages checks out head_sha, then commits a
            # bump ON TOP and pushes, so the new bump commit is the current tip.
            # Only act when that tip is the auto-bump commit; otherwise a no-op
            # update run (no changes) would rebuild every package.
            head="${{ github.event.workflow_run.head_sha }}"
            msg=$(git show -s --format='%s' HEAD)
            if [ "$msg" != "auto: bump package versions" ]; then
              matrix='[]'
            else
              changed=$(git diff --name-only "${head}" HEAD \
                | grep '/PKGBUILD$' | sed 's|/PKGBUILD$||' | sed 's|^\./||' \
                | grep -v '^_template$' | sort -u)
              if [ -z "$changed" ]; then
                matrix='[]'
              else
                matrix=$(printf '%s\n' "$changed" \
                  | jq -R -s -c 'split("\n") | map(select(. != ""))')
              fi
            fi
          else
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              changed=$(git diff --name-only HEAD~1 HEAD \
                | grep '/PKGBUILD$' | sed 's|/PKGBUILD$||' | sed 's|^\./||' \
                | grep -v '^_template$' | sort -u)
            else
              changed=""
            fi
            if [ -z "$changed" ]; then
              matrix=$(find . -maxdepth 2 -name PKGBUILD -exec dirname {} \; \
                | sed 's|^\./||' | grep -v '^_template$' | sort -u \
                | jq -R -s -c 'split("\n") | map(select(. != ""))')
            else
              matrix=$(printf '%s\n' "$changed" \
                | jq -R -s -c 'split("\n") | map(select(. != ""))')
            fi
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: needs.detect.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ${{ fromJson(needs.detect.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - name: Build in cachyos container
        run: |
          docker run --rm -v "$PWD":/ws -w /ws \
            cachyos/docker-makepkg-v3 bash -c '
              sudo chown -R notroot:notroot /ws
              sudo sed -i "/^\[options\]/a DisableSandbox" /etc/pacman.conf
              sudo pacman-key --init >/dev/null 2>&1
              sudo pacman -Sy --noconfirm archlinux-keyring cachyos-keyring >/dev/null 2>&1
              sudo pacman-key --populate archlinux cachyos >/dev/null 2>&1
              sudo pacman -Syu --noconfirm >/dev/null 2>&1 || true
              export PKGDEST="/ws"
              cd "${{ matrix.package }}"
              makepkg -cfs --noconfirm
            '
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}
          path: '*.pkg.tar.zst'

  publish:
    needs: [detect, build]
    if: needs.detect.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: repo-staging
          pattern: '*'
          merge-multiple: true
      - name: Fetch existing repo database + package files (accumulate)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Carry forward the previously published db AND package files so
          # repo-add MERGES the freshly built packages into the existing set
          # instead of starting from scratch. Without the package files, a
          # single-package build only carried its own *.pkg.tar.zst, so the
          # other packages' files vanished when the release was recreated
          # (the db kept their entries but the files were gone -> 404 on
          # install). The release itself is recreated further down; the db
          # and files are preserved by carrying them forward here.
          gh release download repository \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "${REPO_NAME}.db.tar.zst" \
            --dir repo-staging 2>/dev/null || true
          # Old package files go to a separate dir so we can drop stale
          # versions of packages rebuilt in THIS run (their fresh artifacts
          # are already in repo-staging from the build step).
          gh release download repository \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "*.pkg.tar.zst" \
            --dir old-pkgs 2>/dev/null || true
          for f in old-pkgs/*.pkg.tar.zst; do
            [ -e "$f" ] || continue
            # package name = filename minus arch, pkgrel, pkgver
            # (none of those contain '-', so strip the last 3 '-' fields)
            name=$(basename "$f" .pkg.tar.zst \
              | sed -E 's/-[^-]+$//; s/-[^-]+$//; s/-[^-]+$//')
            if ls repo-staging/"$name"-*.pkg.tar.zst >/dev/null 2>&1; then
              rm -f "$f"
            fi
          done
          mv old-pkgs/*.pkg.tar.zst repo-staging/ 2>/dev/null || true
      - name: Build repo database
        run: |
          sudo docker run --rm -v "$PWD/repo-staging":/data -w /data \
            -e REPO_NAME="${{ env.REPO_NAME }}" \
            archlinux:latest bash -c '
              pacman -Sy --noconfirm >/dev/null 2>&1 || true
              repo-add "${REPO_NAME}.db.tar.zst" *.pkg.tar.zst
            '
      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="repository"
          # Floating tag: recreate every run so the release's underlying git
          # tag always points at the current commit (mirrors rust_template
          # nightly/docs). No git push --force, no workflows scope. The db
          # above already carries forward all previously-published packages,
          # so this only rotates the tag -- it does not drop packages.
          gh release delete "$tag" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" 2>/dev/null || true
          gh release create "$tag" \
            --title "Package Repository" \
            --notes "" \
            --target "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY"
          gh release upload "$tag" repo-staging/* --clobber --repo "$GITHUB_REPOSITORY"
