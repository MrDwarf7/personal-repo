name: Build packages

on:
  push:
    paths:
      - '*/PKGBUILD'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package directory to build (leave empty for all)'
        required: false
        type: string

permissions:
  contents: write

env:
  REPO_NAME: personal-repo

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.changed.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Find changed packages
        id: changed
        run: |
          if [ -n "${{ github.event.inputs.package }}" ]; then
            matrix=$(printf '%s\n' "${{ github.event.inputs.package }}" \
              | jq -R -s -c 'split("\n") | map(select(. != ""))')
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            matrix=$(find . -maxdepth 2 -name PKGBUILD -exec dirname {} \; \
              | sed 's|^\./||' | grep -v '^_template$' | sort -u \
              | jq -R -s -c 'split("\n") | map(select(. != ""))')
          else
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              changed=$(git diff --name-only HEAD~1 HEAD \
                | grep '/PKGBUILD$' | sed 's|/PKGBUILD$||' | sed 's|^\./||' \
                | grep -v '^_template$' | sort -u)
            else
              changed=""
            fi
            if [ -z "$changed" ]; then
              matrix=$(find . -maxdepth 2 -name PKGBUILD -exec dirname {} \; \
                | sed 's|^\./||' | grep -v '^_template$' | sort -u \
                | jq -R -s -c 'split("\n") | map(select(. != ""))')
            else
              matrix=$(printf '%s\n' "$changed" \
                | jq -R -s -c 'split("\n") | map(select(. != ""))')
            fi
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: needs.detect.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ${{ fromJson(needs.detect.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - name: Build in cachyos container
        run: |
          docker run --rm -v "$PWD":/ws -w /ws \
            cachyos/docker-makepkg-v3 bash -c '
              sudo chown -R notroot:notroot /ws
              sudo pacman-key --init >/dev/null 2>&1
              sudo pacman -Sy --noconfirm --disable-sandbox archlinux-keyring cachyos-keyring >/dev/null 2>&1
              sudo pacman-key --populate archlinux cachyos >/dev/null 2>&1
              sudo pacman -Syu --noconfirm --disable-sandbox >/dev/null 2>&1 || true
              export PACMAN="pacman --disable-sandbox"
              cd "${{ matrix.package }}"
              makepkg -cfs --noconfirm
            '
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}
          path: ${{ matrix.package }}/*.pkg.tar.zst
          retention-days: 1

  publish:
    needs: [detect, build]
    if: needs.detect.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: repo-staging
          merge-multiple: true
      - name: Build repo database
        run: |
          sudo docker run --rm -v "$PWD/repo-staging":/data -w /data \
            -e REPO_NAME="${{ env.REPO_NAME }}" \
            archlinux:latest bash -c '
              pacman -Sy --noconfirm >/dev/null 2>&1 || true
              repo-add "${REPO_NAME}.db.tar.zst" *.pkg.tar.zst
              cp -L "${REPO_NAME}.db" "${REPO_NAME}.db.tar.zst"
              cp -L "${REPO_NAME}.files" "${REPO_NAME}.files.tar.zst"
            '
      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="repository"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" --title "Package Repository" --notes "" --repo "$GITHUB_REPOSITORY"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' \
            | while read -r asset; do
                [ -n "$asset" ] && gh release delete-asset "$tag" "$asset" --repo "$GITHUB_REPOSITORY" -y || true
              done
          gh release upload "$tag" repo-staging/* --clobber --repo "$GITHUB_REPOSITORY"
